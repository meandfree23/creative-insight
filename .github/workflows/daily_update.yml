name: Daily Creative Insight Update

on:
  schedule:
    - cron: '0 23 * * *' # 8:00 AM KST
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Target Date (YYYY-MM-DD)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run script
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python fetch_ideas.py ${{ github.event.inputs.target_date }}

          # Save the generated daily file to a temporary location
          TARGET_FILE=$(ls -t data/daily/*.json | head -1)
          if [ -z "$TARGET_FILE" ]; then
            echo "No daily file generated. Exiting."
            exit 1
          fi
          FILENAME=$(basename "$TARGET_FILE")
          cp "$TARGET_FILE" /tmp/$FILENAME

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          for i in {1..15}; do
            # Reset to latest main to avoid any merge conflicts
            git fetch origin main
            git reset --hard origin/main
            
            # Restore our generated file
            cp /tmp/$FILENAME data/daily/$FILENAME
            
            # Rebuild manifest.json dynamically
            cat << 'EOF' > rebuild.py
            import os, json
            dates = sorted([f.replace(".json", "") for f in os.listdir("data/daily") if f.endswith(".json")], reverse=True)
            with open("data/manifest.json", "w") as f:
                json.dump({"dates": dates}, f, indent=2)
            EOF
            python3 -c "import textwrap; exec(textwrap.dedent(open('rebuild.py').read()))"
            rm rebuild.py
            git add data/
            if git diff --staged --quiet; then
              echo "No changes to commit."
              break
            fi
            
            git commit -m "Automated daily update for $FILENAME"
            git push origin main && break || sleep $((RANDOM % 10 + 5))
          done
