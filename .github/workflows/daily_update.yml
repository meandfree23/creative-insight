name: Daily Creative Insight Update

on:
  schedule:
    - cron: '17 20 * * *' # 5:17 AM KST (Primary early-bird trigger)
    - cron: '43 22 * * *' # 7:43 AM KST (Safety-net fallback if GitHub drops/stalls primary cron)
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Target Date (YYYY-MM-DD)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Radar Agent (Sundays Only)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI || secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI || secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY }}
        run: |
          if [ $(TZ='Asia/Seoul' date +%w) -eq 0 ]; then
            echo "Running Radar Agent to discover new sources (KST Sunday)..."
            python agents/radar.py
          else
            echo "Not Sunday in KST. Skipping Radar Agent."
          fi

      - name: Run script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI || secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI || secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY }}
        run: |
          python fetch_ideas.py ${{ github.event.inputs.target_date }}

          # Save all generated daily files AND sources.json to separate temporary locations
          mkdir -p /tmp/daily_backup
          rm -f data/daily/sources.json
          cp data/daily/*.json /tmp/daily_backup/
          cp data/sources.json /tmp/sources_backup.json

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          for i in {1..15}; do
            # Reset to latest main to avoid any merge conflicts
            git fetch origin main
            git reset --hard origin/main
            
            # Restore all generated daily files and preserved sources registry separately
            rm -f data/daily/sources.json
            cp /tmp/daily_backup/*.json data/daily/
            cp /tmp/sources_backup.json data/sources.json
            
            # Rebuild manifest.json dynamically (strictly YYYY-MM-DD files only)
            python3 -c "import os, re, json; json.dump({'dates': sorted([f[:-5] for f in os.listdir('data/daily') if re.match(r'^\d{4}-\d{2}-\d{2}\.json$', f)], reverse=True)}, open('data/manifest.json', 'w'), indent=2)"
            git add data/
            if git diff --staged --quiet; then
              echo "No changes to commit."
              break
            fi
            
            git commit -m "Automated daily update"
            git push origin main && break || sleep $((RANDOM % 10 + 5))
          done
